<div class="header-right">
  <div id="timerDisplay" class="timer-display">02:00:00</div>
  <button id="btnPause" class="btn btn-outline" type="button">Pause</button>
  <button id="btnFullscreen" class="btn btn-outline" type="button">Fullscreen</button>
  <button id="btnSubmitTop" class="btn btn-danger" type="button">Submit Test</button>
</div>


<!-- Central Work Area -->
<section class="question-workspace" id="questionWorkspace">
  
  <!-- Top Question Meta Info -->
  <div class="question-meta-bar">
    <span id="questionNumber" class="q-badge">Question 1</span>
    <!-- Topic: Strictly shown only in Review Mode -->
    <span id="topicTag" class="topic-tag" style="display: none;"></span>
  </div>

  <!-- Scrollable Question & Passage Content -->
  <div class="question-scroll-body" id="questionScrollBody">
    
    <!-- Passage Block (Stacked Directly Above Question) -->
    <div id="passageContainer" class="passage-box" style="display: none;">
      <div class="passage-label">Read the passage carefully and answer the question that follows:</div>
      <div id="passageText" class="passage-content"></div>
    </div>

    <!-- Question Body -->
    <div class="question-box">
      <div id="questionText" class="question-text">Loading examination content...</div>
      <div id="optionsContainer" class="options-container"></div>

      <!-- Review-Only Detail Panel (Explanations & UPSC Answer Key) -->
      <div id="reviewDetails" class="review-panel" style="display: none;">
        <div class="review-meta-row">
          <span id="userStatusText" class="review-status"></span>
          <span id="correctAnswerText" class="review-key"></span>
        </div>
        <div class="explanation-title">Explanation:</div>
        <p id="explanationText" class="explanation-body"></p>
      </div>
    </div>

  </div>

  <!-- Action Button Bar -->
  <footer class="bottom-action-bar">
    <div class="nav-left">
      <button id="btnPrev" class="btn btn-outline" type="button">&larr; Previous</button>
    </div>

    <!-- Controls: Pre-Submit Attempt Phase -->
    <div id="attemptActions" class="nav-right">
      <button id="btnClear" class="btn btn-outline-danger" type="button">Clear Response</button>
      <button id="btnSaveNext" class="btn btn-primary" type="button">Save &amp; Next &rarr;</button>
    </div>

    <!-- Controls: Post-Submit Review Phase -->
    <div id="reviewActions" class="nav-right" style="display: none;">
      <button id="btnNext" class="btn btn-primary" type="button">Next &rarr;</button>
    </div>
  </footer>

</section>

<!-- Right-Hand Side Question Palette -->
<aside class="palette-sidebar">
  <div class="palette-top">
    <div class="palette-heading">Question Palette</div>
    <div id="paletteCount" class="palette-stats">0/80 Attempted</div>
  </div>

  <div id="paletteLegend" class="palette-legend">
    <!-- Rendered dynamically for Exam vs Review -->
  </div>

  <div id="paletteGrid" class="palette-grid">
    <!-- Palette tiles generated by JavaScript -->
  </div>
</aside>


    <div class="radio-selection-list">
      <label class="radio-item">
        <input type="radio" name="testMode" value="year_2024" checked>
        <div class="radio-text">
          <strong>2024 Full Mock Exam</strong>
          <small>All 80 Questions &bull; 120 Minutes &bull; +2.5 / -0.833 Marking</small>
        </div>
      </label>

      <label class="radio-item">
        <input type="radio" name="testMode" value="mixed_20">
        <div class="radio-text">
          <strong>Sectional Mock (20 Questions)</strong>
          <small>Random Selection &bull; 30 Minutes</small>
        </div>
      </label>

      <label class="radio-item">
        <input type="radio" name="testMode" value="mixed_40">
        <div class="radio-text">
          <strong>Half Mock (40 Questions)</strong>
          <small>Random Selection &bull; 60 Minutes</small>
        </div>
      </label>
    </div>
  </div>
  <div class="modal-footer">
    <button id="btnStartConfirmed" class="btn btn-primary btn-large" type="button">Start Examination</button>
  </div>
</div>


    <table class="result-table">
      <tbody>
        <tr><td>Total Questions</td><td id="resTotal">80</td></tr>
        <tr><td>Attempted</td><td id="resAttempted">0</td></tr>
        <tr><td>Unattempted</td><td id="resUnattempted">0</td></tr>
        <tr><td>Correct (+2.5)</td><td id="resCorrect" class="text-green">0</td></tr>
        <tr><td>Incorrect (-0.833)</td><td id="resWrong" class="text-red">0</td></tr>
      </tbody>
    </table>
  </div>
  <div class="modal-footer">
    <button id="btnEnterReview" class="btn btn-primary btn-large" type="button">Enter Review Mode</button>
  </div>
</div>
